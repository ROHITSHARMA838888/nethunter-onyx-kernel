name: Build POCO F7 Onyx NetHunter GKI 6.6 Kernel

on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build NetHunter GKI 6.6 Kernel (All Wi-Fi Drivers)
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space & Install Dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt update -y
          sudo apt install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev libncurses5-dev libssl-dev libxml2-utils bc python3 patch gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Setup Clang Toolchain (AOSP r510928)
        run: |
          mkdir -p toolchain
          git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r510928.git toolchain/clang
          echo "${GITHUB_WORKSPACE}/toolchain/clang/bin" >> $GITHUB_PATH

      - name: Clone Google Common GKI 6.6 Tree
        run: |
          git clone --depth=1 https://android.googlesource.com/kernel/common -b android15-6.6 common

      - name: Integrate Wi-Fi Drivers (RTL8812AU / RTL8821AU / RTL8188EUS)
        run: |
          cd common
          # 1. mac80211 Packet Injection Patch
          curl -LSs "https://raw.githubusercontent.com/kimocoder/qualcomm_patches/master/mac80211.patch" | patch -p1 || true

          # 2. Add RTL8812AU & RTL8821AU (TP-Link Archer T2U Plus + Alfa AWUS036ACH)
          git clone --depth=1 https://github.com/aircrack-ng/rtl8812au.git drivers/net/wireless/rtl8812au
          echo "obj-\$(CONFIG_8812AU) += rtl8812au/" >> drivers/net/wireless/Makefile
          echo "source \"drivers/net/wireless/rtl8812au/Kconfig\"" >> drivers/net/wireless/Kconfig

          # 3. Add RTL8188EUS (TP-Link WN722N v2/v3)
          git clone --depth=1 https://github.com/aircrack-ng/rtl8188eus.git drivers/net/wireless/rtl8188eus
          echo "obj-\$(CONFIG_8188EU) += rtl8188eus/" >> drivers/net/wireless/Makefile
          echo "source \"drivers/net/wireless/rtl8188eus/Kconfig\"" >> drivers/net/wireless/Kconfig

      - name: Configure NetHunter Flags (4KB Page Size + All Drivers)
        run: |
          cd common
          # Append 4KB page size and wireless configs
          cat << 'EOF' >> arch/arm64/configs/gki_defconfig
          CONFIG_ARM64_4K_PAGES=y
          # CONFIG_ARM64_16K_PAGES is not set

          # Wireless Core
          CONFIG_CFG80211=m
          CONFIG_MAC80211=m
          CONFIG_MAC80211_MESH=y
          CONFIG_MAC80211_RC_MINSTREL=y

          # Atheros AR9271 (WN722N v1, Alfa AWUS036NHA)
          CONFIG_WLAN_VENDOR_ATH=y
          CONFIG_ATH9K_HTC=m
          CONFIG_ATH9K_HTC_DEBUGFS=y

          # Ralink / MediaTek (RT3070, RT5370, Alfa AWUS036NEH, MT7601U)
          CONFIG_WLAN_VENDOR_RALINK=y
          CONFIG_RT2X00=m
          CONFIG_RT2800USB=m
          CONFIG_RT2800USB_RT33XX=y
          CONFIG_RT2800USB_RT35XX=y
          CONFIG_RT2800USB_RT53XX=y
          CONFIG_WLAN_VENDOR_MEDIATEK=y
          CONFIG_MT7601U=m

          # Realtek (RTL8187, RTL8188EUS, RTL8812AU / RTL8821AU)
          CONFIG_WLAN_VENDOR_REALTEK=y
          CONFIG_RTL8187=m
          CONFIG_8812AU=m
          CONFIG_8188EU=m

          # BadUSB HID & USB Gadget
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_CONFIGFS_MASS_STORAGE=y
          CONFIG_BT_HCIBTUSB=m
          EOF

      - name: Compile Kernel and Modules
        run: |
          cd common
          export PATH="${GITHUB_WORKSPACE}/toolchain/clang/bin:$PATH"

          # Use LLVM=1 and aarch64-linux-gnu- Cross-Compiler
          make -j$(nproc) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- gki_defconfig
          make -j$(nproc) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- Image modules

      - name: Collect Modules and Firmware
        run: |
          mkdir -p AnyKernel3/modules/vendor/lib/modules
          mkdir -p AnyKernel3/firmware

          # Copy compiled kernel Image
          cp common/out/arch/arm64/boot/Image AnyKernel3/

          # Copy compiled driver modules (.ko)
          find common/out -name "*.ko" -exec cp {} AnyKernel3/modules/vendor/lib/modules/ \;

          # Download Essential Wi-Fi Firmware binaries
          curl -LSs "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/ath9k_htc/htc_9271-1.4.0.fw" -o AnyKernel3/firmware/htc_9271.fw
          curl -LSs "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rt2870.bin" -o AnyKernel3/firmware/rt2870.bin
          curl -LSs "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/mt7601u.bin" -o AnyKernel3/firmware/mt7601u.bin

      - name: Package AnyKernel3 Flashable Zip
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 -b gki tmp_ak3
          cp -r tmp_ak3/* AnyKernel3/
          cd AnyKernel3

          # Configure anykernel.sh for POCO F7 (Onyx)
          sed -i 's/device.name1=.*/device.name1=onyx/g' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=peridot/g' anykernel.sh

          zip -r9 NetHunter-Kernel-POCO-F7-Onyx-AllWifi.zip * -x .git README.md *placeholder

      - name: Upload Flashable NetHunter Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Kernel-POCO-F7-Onyx-AllWifi
          path: AnyKernel3/NetHunter-Kernel-POCO-F7-Onyx-AllWifi.zip
