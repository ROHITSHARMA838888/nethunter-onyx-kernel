name: Build Kali NetHunter Kernel for POCO F7 (Rohit Sharma Edition)

on:
  workflow_dispatch:

jobs:
  build-rohit-kernel:
    runs-on: ubuntu-24.04
    steps:
      - name: Setup 10GB Swap Space
        run: |
          sudo swapoff -a || true
          SWAPFILE=/mnt/swapfile
          sudo fallocate -l 10G $SWAPFILE || sudo dd if=/dev/zero of=$SWAPFILE bs=1M count=10240 status=progress
          sudo chmod 600 $SWAPFILE
          sudo mkswap $SWAPFILE
          sudo swapon $SWAPFILE

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex git gnupg libncurses-dev \
            libssl-dev libelf-dev lzop rsync zip python3 clang lld llvm jq gcc-aarch64-linux-gnu

      - name: Clone POCO F7 NetHunter Kernel Source Tree
        run: |
          SRC_URL=$(echo "aHR0cHM6Ly9naXRodWIuY29tL29ueXgtb3NzL2tvbm9oYS1rZXJuZWwtZ2tpLmdpdA==" | base64 -d)
          git clone --depth=1 "$SRC_URL" -b feature/nethunter kernel-source
          cd kernel-source
          
          # Cleanly rename the target defconfig without touching any other configs
          TARGET_DEF=$(echo "a29ub2hhX2RlZmNvbmZpZw==" | base64 -d)
          [ -f "arch/arm64/configs/$TARGET_DEF" ] && mv "arch/arm64/configs/$TARGET_DEF" "arch/arm64/configs/rohit_defconfig"
          sed -i "s/$TARGET_DEF/rohit_defconfig/g" build.sh

          # Cleanly rename zip branding
          ZIP_BRAND=$(echo "S29uby1IYQ==" | base64 -d)
          sed -i "s/$ZIP_BRAND/NetHunter-Rohit/g" build.sh

          # Prevent modpost from aborting on external module symbol warnings
          sed -i 's/make "${MAKE_ARGS\[@\]}"/make "${MAKE_ARGS[@]}" KBUILD_MODPOST_WARN=1/g' build.sh

      - name: Download Clang Toolchain
        run: |
          mkdir -p toolchains
          git clone --depth=1 https://github.com/ZyCromerZ/Clang.git -b main toolchains/clang

      - name: Setup Pure 64-Bit AnyKernel3 with Custom UI for ROHIT SHARMA
        run: |
          cd kernel-source
          rm -rf anykernel ak3_arm64
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          
          # Replace with official osm0sis arm64-tools (Pure 64-bit for Snapdragon 8s Gen 4)
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git -b arm64-tools ak3_arm64
          cp -f ak3_arm64/* anykernel/tools/
          rm -rf ak3_arm64
          chmod -R +x anykernel/tools/

          # Custom Banner for Rohit Sharma
          echo "" | base64 -d > anykernel/banner

          # Custom anykernel.sh with UI messages
          echo "" | base64 -d > anykernel/anykernel.sh

      - name: Pre-configure KernelSU-Next to Prevent Hanging
        run: |
          cd kernel-source
          mkdir -p .root_modules/KernelSU-Next
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git -b dev .root_modules/KernelSU-Next
          
          # Neutralize git unshallow commands that freeze make inside subshells
          sed -i 's/git fetch --unshallow/true/g' .root_modules/KernelSU-Next/kernel/Kbuild || true
          sed -i 's/--unshallow//g' .root_modules/KernelSU-Next/kernel/Kbuild || true
          sed -i 's/KSU_GIT_VERSION_VALID := 1/KSU_GIT_VERSION_VALID := 1\nKSU_GIT_VERSION := 12000\nKSU_GIT_TAG := v1.0.5/g' .root_modules/KernelSU-Next/kernel/Kbuild || true
          rm -rf .root_modules/KernelSU-Next/.git

      - name: Build NetHunter Kernel
        run: |
          cd kernel-source
          chmod +x build.sh nethunter_patch.sh
          
          ./build.sh \
            hz=250 \
            variant=root \
            root=ksu-next \
            nethunter=on \
            kernel_name="-NetHunter-Rohit" \
            bypasscharging=on \
            htsr=on \
            autofdo=off \
            lto=none

      - name: Compile and Bundle All Wireless Drivers & Firmware
        run: |
          cd kernel-source
          mkdir -p wifi_drivers
          
          # 1. Compile out-of-tree RTL8821AU (Archer T2U Plus) driver cleanly
          echo "[+] Compiling RTL8821AU driver..."
          git clone --depth=1 https://github.com/morrownr/8821au-20210708.git /tmp/8821au || true
          if [ -d /tmp/8821au ]; then
            make -C out M=/tmp/8821au ARCH=arm64 LLVM=1 -j$(nproc --all) modules || true
            cp -v /tmp/8821au/*.ko wifi_drivers/ 2>/dev/null || true
          fi
          
          # 2. Collect in-kernel modules (rtl8xxxu, ath9k_htc, rt2800usb, cfg80211, mac80211)
          echo "[+] Collecting built-in kernel modules..."
          find out/ -name "*.ko" -exec cp -v {} wifi_drivers/ \; || true
          
          # 3. Download firmware for AR9271 and RT2800
          echo "[+] Downloading Wi-Fi firmware..."
          curl -LSs -o wifi_drivers/htc_9271.fw "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/ath9k_htc/htc_9271-1.4.0.fw" || true
          curl -LSs -o wifi_drivers/rt2870.bin "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rt2870.bin" || true
          
          # 4. Prepare release zip with wifi_drivers bundled
          mkdir -p final_release
          ORIGINAL_ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)
          cp "$ORIGINAL_ZIP" final_release/NetHunter-POCO-F7-Onyx-Rohit-Edition.zip
          
          # Inject wifi_drivers and custom files into final zip
          zip -u final_release/NetHunter-POCO-F7-Onyx-Rohit-Edition.zip anykernel/banner
          zip -u final_release/NetHunter-POCO-F7-Onyx-Rohit-Edition.zip anykernel/anykernel.sh
          zip -r final_release/NetHunter-POCO-F7-Onyx-Rohit-Edition.zip wifi_drivers/
          
          ls -lh final_release/

      - name: Upload Flashable NetHunter Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-POCO-F7-Onyx-Rohit-Edition
          path: kernel-source/final_release/NetHunter-POCO-F7-Onyx-Rohit-Edition.zip
          retention-days: 7
