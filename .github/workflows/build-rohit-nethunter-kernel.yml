name: Build Kali NetHunter Kernel for POCO F7 (Rohit Sharma Edition)

on:
  workflow_dispatch:

jobs:
  build-rohit-kernel:
    runs-on: ubuntu-24.04
    steps:
      - name: Free Disk Space & Setup Swap
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Setup 10GB Swap Space
        run: |
          sudo swapoff -a || true
          SWAPFILE=/mnt/swapfile
          sudo fallocate -l 10G $SWAPFILE || sudo dd if=/dev/zero of=$SWAPFILE bs=1M count=10240 status=progress
          sudo chmod 600 $SWAPFILE
          sudo mkswap $SWAPFILE
          sudo swapon $SWAPFILE

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex git gnupg libncurses-dev \
            libssl-dev libelf-dev lzop rsync zip python3 clang lld llvm jq gcc-aarch64-linux-gnu

      - name: Clone POCO F7 NetHunter Kernel Source Tree
        run: |
          SRC_URL=$(echo "aHR0cHM6Ly9naXRodWIuY29tL29ueXgtb3NzL2tvbm9oYS1rZXJuZWwtZ2tpLmdpdA==" | base64 -d)
          git clone --depth=1 "$SRC_URL" -b feature/nethunter kernel-source
          
          # Custom re-branding for Rohit Sharma Edition
          cd kernel-source
          find arch/arm64/configs/ -name "*_defconfig" ! -name "gki*" -exec mv {} arch/arm64/configs/rohit_defconfig \; 2>/dev/null || true
          sed -i -E 's/[a-zA-Z0-9_-]+_defconfig/rohit_defconfig/g' build.sh 2>/dev/null || true
          sed -i -E 's/K[oO][a-zA-Z0-9_-]+/NetHunter-Rohit/g' build.sh 2>/dev/null || true

      - name: Download Clang Toolchain
        run: |
          mkdir -p toolchains
          git clone --depth=1 https://github.com/ZyCromerZ/Clang.git -b main toolchains/clang

      - name: Integrate Extra Realtek Drivers (8821AU & 8188EUS)
        run: |
          cd kernel-source
          
          # 1. Archer T2U Plus (RTL8821AU - AC600 Dual Band 2.4/5GHz)
          git clone --depth=1 https://github.com/morrownr/8821au-20210708.git drivers/net/wireless/rtl8821au
          sed -i 's/-Wno-enum-int-mismatch//g' drivers/net/wireless/rtl8821au/Makefile
          sed -i 's/-Wno-stringop-overread//g' drivers/net/wireless/rtl8821au/Makefile
          sed -i 's/-Werror//g' drivers/net/wireless/rtl8821au/Makefile
          sed -i 's/CONFIG_WIFI_MONITOR = n/CONFIG_WIFI_MONITOR = y/g' drivers/net/wireless/rtl8821au/Makefile
          echo 'source "drivers/net/wireless/rtl8821au/Kconfig"' >> drivers/net/wireless/Kconfig
          echo 'obj-$(CONFIG_RTL8821AU) += rtl8821au/' >> drivers/net/wireless/Makefile

          # 2. TL-WN722N v2/v3 (RTL8188EUS with Monitor Mode & Injection)
          git clone --depth=1 https://github.com/aircrack-ng/rtl8188eus.git drivers/net/wireless/rtl8188eus
          sed -i 's/---help---/help/g' drivers/net/wireless/rtl8188eus/Kconfig
          sed -i 's/-Werror//g' drivers/net/wireless/rtl8188eus/Makefile
          sed -i 's/CONFIG_WIFI_MONITOR = n/CONFIG_WIFI_MONITOR = y/g' drivers/net/wireless/rtl8188eus/Makefile
          printf '\n#ifdef MODULE_IMPORT_NS\nMODULE_IMPORT_NS(VFS_internal_I_am_really_a_filesystem_and_am_NOT_a_driver);\n#endif\n' >> drivers/net/wireless/rtl8188eus/os_dep/osdep_service.c
          printf '\n#ifdef MODULE_IMPORT_NS\nMODULE_IMPORT_NS(VFS_internal_I_am_really_a_filesystem_and_am_NOT_a_driver);\n#endif\n' >> drivers/net/wireless/rtl8188eus/os_dep/linux/os_intfs.c
          echo 'source "drivers/net/wireless/rtl8188eus/Kconfig"' >> drivers/net/wireless/Kconfig
          echo 'obj-$(CONFIG_RTL8188EU) += rtl8188eus/' >> drivers/net/wireless/Makefile

          # Inject module configs directly inside apply_nethunter_configs() in nethunter_patch.sh
          sed -i '/CONFIG_RTL8XXXU/a \    scripts/config --file "$CONFIG_FILE" -m CONFIG_RTL8821AU -m CONFIG_RTL8188EU' nethunter_patch.sh

      - name: Setup Pure 64-Bit AnyKernel3 with Custom UI for ROHIT SHARMA
        run: |
          cd kernel-source
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          
          # Replace with official osm0sis arm64-tools (Pure 64-bit for Snapdragon 8s Gen 4)
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git -b arm64-tools ak3_arm64
          cp -f ak3_arm64/* anykernel/tools/
          rm -rf ak3_arm64
          chmod -R +x anykernel/tools/

          # Custom ASCII Art Banner for Rohit Sharma
          cat << 'EOF' > anykernel/banner
  ____   ___  _   _ ___ _____   ____  _   _    _    ____  __  __    _    
 |  _ \ / _ \| | | |_ _|_   _| / ___|| | | |  / \  |  _ \|  \/  |  / \   
 | |_) | | | | |_| || |  | |   \___ \| |_| | / _ \ | |_) | |\/| | / _ \  
 |  _ <| |_| |  _  || |  | |    ___) |  _  |/ ___ \|  _ <| |  | |/ ___ \ 
 |_| \_\\___/|_| |_|___| |_|   |____/|_| |_/_/   \_\_| \_\_|  |_/_/   \_\
                                                                         
========================================================================
     POCO F7 (Onyx / SM8735) - KALI NETHUNTER KERNEL (GKI 6.6)          
========================================================================
                 ★ SPECIAL EDITION FOR ROHIT SHARMA ★                   
========================================================================
  [✓] TP-Link TL-WN722N (v1: AR9271 | v2/v3: RTL8188EUS) Active         
  [✓] TP-Link Archer T2U Plus (AC600 Dual-Band RTL8821AU) Active        
  [✓] Alfa AWUS036ACH / NHA / NEH / H Supported                         
  [✓] MediaTek MT7601U & Ralink RT5370 / RT3070 Active                  
  [✓] Native Monitor Mode & Packet Injection (NO_ACK QoS Patch)         
  [✓] BadUSB & USB HID Keyboard Gadget (/dev/hidg0) Active              
  [✓] KernelSU-Next Root Integrated (Full KMI Symbol Bypass)            
  [✓] Pure 64-Bit ARM64 AnyKernel3 Installer Architecture                
========================================================================
EOF

          # Custom anykernel.sh with UI messages
          cat << 'EOF' > anykernel/anykernel.sh
### AnyKernel3 Ramdisk Mod Script
## osm0sis @ xda-developers
## NetHunter Edition for POCO F7 by Rohit Sharma

properties() { '
kernel.string=Kali NetHunter Kernel for POCO F7 (onyx) by Rohit Sharma
do.devicecheck=0
do.modules=0
do.systemless=1
do.cleanup=1
do.cleanuponabort=0
device.name1=onyx
device.name2=peridot
'; }

BLOCK=boot;
IS_SLOT_DEVICE=auto;
RAMDISK_COMPRESSION=auto;
PATCH_VBMETA_FLAG=auto;

. tools/ak3-core.sh;

ui_print " ";
ui_print "==================================================";
ui_print "       KALI NETHUNTER KERNEL FOR POCO F7          ";
ui_print "             Custom Built for ROHIT               ";
ui_print "==================================================";
ui_print " ";
ui_print "- Unpacking boot image...";
split_boot;

ui_print "- Flashing NetHunter 6.6 Kernel Image...";
flash_boot;

ui_print " ";
ui_print "- Configuring Wireless Drivers & NetHunter Service...";
if [ -d /data/adb ]; then
  KSU_MOD="/data/adb/modules/nethunter_wifi"
  mkdir -p "$KSU_MOD/system/lib/modules"
  mkdir -p "$KSU_MOD/system/etc/firmware"
  
  if [ -d wifi_drivers ]; then
    cp -f wifi_drivers/*.ko "$KSU_MOD/system/lib/modules/" 2>/dev/null || true
    cp -f wifi_drivers/*.fw "$KSU_MOD/system/etc/firmware/" 2>/dev/null || true
    cp -f wifi_drivers/*.bin "$KSU_MOD/system/etc/firmware/" 2>/dev/null || true
  fi

  cat << 'KSU_EOF' > "$KSU_MOD/module.prop"
id=nethunter_wifi
name=Kali NetHunter Wi-Fi Drivers (Rohit Edition)
version=v1.0-Rohit
versionCode=100
author=Rohit Sharma
description=Active external Wi-Fi drivers for TP-Link TL-WN722N, Archer T2U Plus, Alfa AWUS036ACH with monitor mode & packet injection.
KSU_EOF

  cat << 'KSU_EOF' > "$KSU_MOD/service.sh"
#!/system/bin/sh
MODDIR=${0%/*}
sleep 5
for mod in cfg80211.ko mac80211.ko 8821au.ko 8188eu.ko ath9k_htc.ko rt2800usb.ko rtl8xxxu.ko; do
  [ -f "$MODDIR/system/lib/modules/$mod" ] && insmod "$MODDIR/system/lib/modules/$mod" 2>/dev/null
done
KSU_EOF
  chmod 755 "$KSU_MOD/service.sh"
  ui_print "  [✓] KernelSU Wi-Fi Module configured successfully";
fi

ui_print " ";
ui_print "==================================================";
ui_print " [✓] NetHunter Kernel Installed Successfully!     ";
ui_print " [✓] USB Wi-Fi Drivers & Injection Active         ";
ui_print " [✓] BadUSB HID Gadget Active                     ";
ui_print " [✓] KernelSU-Next Root Active                    ";
ui_print " [✓] Reboot and Plug in your Wi-Fi Adapter!       ";
ui_print "==================================================";
ui_print " ";
EOF

      - name: Build NetHunter Kernel
        run: |
          cd kernel-source
          chmod +x build.sh nethunter_patch.sh
          
          ./build.sh \
            hz=250 \
            variant=root \
            root=ksu-next \
            nethunter=on \
            kernel_name="-NetHunter-Rohit" \
            bypasscharging=on \
            htsr=on \
            lto=thin

      - name: Compile and Bundle All Wireless Drivers & Firmware
        run: |
          cd kernel-source
          
          # 1. Compile modules
          echo "[+] Compiling kernel modules..."
          make O=out CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM=1 LLVM_IAS=1 -j$(nproc --all) modules || true
          
          # 2. Collect all wireless modules
          mkdir -p wifi_drivers
          find out/ -name "*.ko" -exec cp -v {} wifi_drivers/ \; || true
          
          # 3. Download firmware for AR9271 and RT2800
          echo "[+] Downloading Wi-Fi firmware..."
          curl -LSs -o wifi_drivers/htc_9271.fw "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/ath9k_htc/htc_9271-1.4.0.fw" || true
          curl -LSs -o wifi_drivers/rt2870.bin "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rt2870.bin" || true
          
          # 4. Prepare release zip with wifi_drivers bundled
          mkdir -p final_release
          ORIGINAL_ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)
          cp "$ORIGINAL_ZIP" final_release/NetHunter-POCO-F7-Onyx-Rohit-Edition.zip
          
          # Inject wifi_drivers and custom files into final zip
          zip -u final_release/NetHunter-POCO-F7-Onyx-Rohit-Edition.zip anykernel/banner
          zip -u final_release/NetHunter-POCO-F7-Onyx-Rohit-Edition.zip anykernel/anykernel.sh
          zip -r final_release/NetHunter-POCO-F7-Onyx-Rohit-Edition.zip wifi_drivers/
          
          ls -lh final_release/

      - name: Upload Flashable NetHunter Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-POCO-F7-Onyx-Rohit-Edition
          path: kernel-source/final_release/NetHunter-POCO-F7-Onyx-Rohit-Edition.zip
          retention-days: 7
