name: Build Realtek 8821AU & 8188EUS NetHunter Modules (Onyx)

on:
  workflow_dispatch:

jobs:
  build-wifi-drivers:
    runs-on: ubuntu-24.04
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu clang lld llvm zip curl git python3

      - name: Setup Kernel & In-Tree Drivers
        run: |
          # 1. Clone Android 15 Linux 6.6 Kernel
          git clone --depth=1 https://android.googlesource.com/kernel/common -b android15-6.6 kernel

          # 2. Clone Archer T2U Plus (8821au) into in-tree wireless folder
          git clone --depth=1 https://github.com/morrownr/8821au-20210708.git kernel/drivers/net/wireless/rtl8821au
          
          # 3. Clone TL-WN722N v2/v3 (rtl8188eus) into in-tree wireless folder
          git clone --depth=1 https://github.com/aircrack-ng/rtl8188eus.git kernel/drivers/net/wireless/rtl8188eus

          # 4. Fix Kconfig syntax for Linux 6.6
          sed -i 's/---help---/help/g' kernel/drivers/net/wireless/rtl8188eus/Kconfig

          # 5. Fix compiler warning flags in 8821au Makefile
          sed -i 's/-Wno-enum-int-mismatch//g' kernel/drivers/net/wireless/rtl8821au/Makefile
          sed -i 's/-Wno-stringop-overread//g' kernel/drivers/net/wireless/rtl8821au/Makefile
          sed -i 's/-Werror//g' kernel/drivers/net/wireless/rtl8821au/Makefile
          sed -i 's/-Werror//g' kernel/drivers/net/wireless/rtl8188eus/Makefile

          # 6. Enable Monitor Mode in drivers
          sed -i 's/CONFIG_WIFI_MONITOR = n/CONFIG_WIFI_MONITOR = y/g' kernel/drivers/net/wireless/rtl8821au/Makefile
          sed -i 's/CONFIG_WIFI_MONITOR = n/CONFIG_WIFI_MONITOR = y/g' kernel/drivers/net/wireless/rtl8188eus/Makefile

          # 7. Fix VFS_internal namespace import for 8188eu on Linux 6.6
          printf '\n#ifdef MODULE_IMPORT_NS\nMODULE_IMPORT_NS(VFS_internal_I_am_really_a_filesystem_and_am_NOT_a_driver);\n#endif\n' >> kernel/drivers/net/wireless/rtl8188eus/os_dep/osdep_service.c
          printf '\n#ifdef MODULE_IMPORT_NS\nMODULE_IMPORT_NS(VFS_internal_I_am_really_a_filesystem_and_am_NOT_a_driver);\n#endif\n' >> kernel/drivers/net/wireless/rtl8188eus/os_dep/linux/os_intfs.c

          # 8. Hook drivers into kernel Kconfig & Makefile
          echo 'source "drivers/net/wireless/rtl8821au/Kconfig"' >> kernel/drivers/net/wireless/Kconfig
          echo 'source "drivers/net/wireless/rtl8188eus/Kconfig"' >> kernel/drivers/net/wireless/Kconfig
          echo 'obj-$(CONFIG_RTL8821AU) += rtl8821au/' >> kernel/drivers/net/wireless/Makefile
          echo 'obj-$(CONFIG_RTL8188EU) += rtl8188eus/' >> kernel/drivers/net/wireless/Makefile

      - name: Configure Kernel with Ultra-Fast Compilation (No LTO)
        run: |
          cd kernel
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- gki_defconfig
          
          # Disable LTO to speed up build from 40 mins to ~4 mins
          scripts/config -d CONFIG_LTO_CLANG_FULL -d CONFIG_LTO_CLANG_THIN -e CONFIG_LTO_NONE
          
          # Disable CFI to prevent sanitize errors
          scripts/config -d CONFIG_CFI_CLANG
          
          # Enable drivers as modules
          scripts/config -e CONFIG_MODULES -e CONFIG_CFG80211 -e CONFIG_MAC80211
          scripts/config -m CONFIG_RTL8821AU -m CONFIG_RTL8188EU

      - name: Compile Kernel Modules (In-Tree with Full Symbols)
        run: |
          cd kernel
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) modules \
            KBUILD_MODPOST_WARN=1 \
            USER_EXTRA_CFLAGS="-Wno-error -Wno-unknown-warning-option -Wno-implicit-function-declaration"

      - name: Collect & Patch Vermagic for POCO F7
        run: |
          mkdir -p output_modules
          find kernel/drivers/net/wireless/ -name "8821au.ko" -exec cp {} output_modules/ \;
          find kernel/drivers/net/wireless/ -name "8188eu.ko" -exec cp {} output_modules/ \;

          ls -la output_modules/

          python3 -c '
          import os

          target = b"vermagic=6.6.142-4k-gd0881fd79058 SMP preempt mod_unload modversions aarch64"
          for root, dirs, files in os.walk("output_modules"):
              for file in files:
                  if file.endswith(".ko"):
                      path = os.path.join(root, file)
                      with open(path, "rb") as f:
                          data = f.read()
                      idx = data.find(b"vermagic=")
                      if idx != -1:
                          end = data.find(b"\0", idx)
                          old = data[idx:end]
                          if len(target) <= len(old):
                              padded = target + b"\0" * (len(old) - len(target))
                              data = data[:idx] + padded + data[end:]
                              with open(path, "wb") as f:
                                  f.write(data)
                              print(f"[OK] Patched vermagic in {file}")
                          else:
                              print(f"[WARN] Target vermagic longer than original in {file}")
                      else:
                          print(f"[WARN] vermagic not found in {file}")
          '

      - name: Upload Compiled 8821AU & 8188EU Modules
        uses: actions/upload-artifact@v4
        with:
          name: Realtek-NetHunter-Drivers-POCO-F7
          path: output_modules/
